<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的海报展 · 52 种风格自我介绍</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:#0f0f14;color:#fff;font-family:'Segoe UI','Microsoft YaHei',sans-serif}
  .hero{text-align:center;padding:56px 20px 20px}
  .hero .badge{display:inline-block;font-size:11px;letter-spacing:3px;color:#ffd166;border:1px solid rgba(255,209,102,.5);border-radius:99px;padding:5px 14px;margin-bottom:16px}
  .hero h1{font-size:clamp(30px,5vw,56px);letter-spacing:2px;background:linear-gradient(90deg,#ff5f6d,#ffc371,#36d1dc,#5b86e5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:#9a9aa5;margin-top:12px;font-size:14px}
  .hero p b{color:#e8e8f0;font-weight:600}
  .wall{max-width:1280px;margin:0 auto;padding:30px 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px}
  .foot{text-align:center;color:#555;font-size:12px;padding:0 20px 50px}
  .foot code{background:#1c1c24;padding:2px 8px;border-radius:5px;color:#ffd166}

  .poster{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:10px;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;display:flex}
  .poster:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .poster.is-big{cursor:default}
  .poster.is-big:hover{transform:none;box-shadow:none}
  .p-frame{position:relative;z-index:2;display:flex;flex-direction:column;padding:20px;width:100%;height:100%}
  .p-eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.75}
  .p-name{font-size:clamp(20px,2.6vw,28px);line-height:1.2;margin-top:6px;word-break:break-all}
  .p-role{font-size:12px;opacity:.85;margin-top:4px}
  .p-intro{font-size:12.5px;line-height:1.65;opacity:.92;margin-top:14px;flex:1;min-height:60px}
  .p-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .p-tags span{font-size:10px;padding:3px 9px;border-radius:99px}
  .p-mail{font-size:10.5px;opacity:.8;margin-top:10px}
  .p-deco{position:absolute;inset:0;pointer-events:none;z-index:1}
  .p-deco i{position:absolute;font-style:normal}

  .lightbox{position:fixed;inset:0;background:rgba(5,5,10,.93);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;padding:50px 20px}
  .lightbox.on{display:flex}
  .lb-stage{display:flex;justify-content:center}
  .lb-stage .poster{width:min(70vh,440px)}
  .lb-cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#bbb;font-size:13px}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:22px;cursor:pointer;z-index:5;transition:background .2s}
  .lb-btn:hover{background:rgba(255,255,255,.22)}
  #lbPrev{left:18px}#lbNext{right:18px}
  #lbClose{position:absolute;top:16px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer;z-index:6}
  #lbClose:hover{background:rgba(255,255,255,.22)}

  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(4deg)}}
  @keyframes huebg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes twinkle{0%,100%{opacity:.45;transform:scale(.85) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes drip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.16)}}
  @keyframes glitchTxt{0%,88%,100%{text-shadow:0 0 12px #0ff,0 0 26px #f0f;transform:none}90%{text-shadow:-3px 0 #0ff,3px 0 #f0f;transform:translateX(-2px)}94%{text-shadow:3px 0 #0ff,-3px 0 #f0f;transform:translateX(2px)}}
  @keyframes gA{0%,86%,100%{transform:translate(0);clip-path:inset(0 0 0 0)}88%{transform:translate(-4px,-2px);clip-path:inset(10% 0 60% 0)}92%{transform:translate(3px,1px);clip-path:inset(55% 0 10% 0)}96%{transform:translate(-2px,2px);clip-path:inset(30% 0 45% 0)}}
  @keyframes gB{0%,86%,100%{transform:translate(0);clip-path:inset(0 0 0 0)}88%{transform:translate(4px,2px);clip-path:inset(70% 0 5% 0)}92%{transform:translate(-3px,-1px);clip-path:inset(5% 0 70% 0)}96%{transform:translate(2px,-2px);clip-path:inset(40% 0 30% 0)}}
  @keyframes neonFlicker{0%,4%,6%,100%{opacity:1}5%{opacity:.35}}
  @keyframes pulseGlow{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes flicker{0%,100%{opacity:.9}50%{opacity:.6}}
  @keyframes pxJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  /* 01 瑞士国际主义 */
  .s-swiss{background:#f5f5f5;color:#111;font-family:Arial,'Helvetica Neue',sans-serif}
  .s-swiss .p-frame{padding:16px;border-top:10px solid #e30613}
  .s-swiss .p-eyebrow{font-weight:700;font-size:11px;color:#111}
  .s-swiss .p-name{font-weight:900;letter-spacing:-1px}
  .s-swiss .p-role{font-weight:700}
  .s-swiss .p-intro{color:#333}
  .s-swiss .p-tags span{background:#111;color:#fff;border-radius:0}
  .s-swiss .p-mail{color:#555}
  .s-swiss .d-grid{inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,#e5e5e5 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#e5e5e5 39px 40px)}
  .s-swiss .d-bar{left:0;right:0;bottom:0;height:26px;background:#e30613}
  .s-swiss .d-dot{right:16px;top:16px;width:14px;height:14px;border-radius:50%;background:#e30613}

  /* 02 包豪斯 */
  .s-bauhaus{background:#e8dcc4;color:#161616;font-family:'Arial Black','Segoe UI',sans-serif}
  .s-bauhaus .p-frame{border:4px solid #111;margin:10px;padding:14px}
  .s-bauhaus .p-name{font-weight:900;text-transform:uppercase}
  .s-bauhaus .p-role{font-weight:700}
  .s-bauhaus .p-intro{font-family:Georgia,serif;font-size:12px}
  .s-bauhaus .p-tags span{background:#111;color:#e8dcc4;border-radius:0;font-weight:700}
  .s-bauhaus .d-circle{width:88px;height:88px;border-radius:50%;background:#e30613;left:-22px;top:-22px;opacity:.92}
  .s-bauhaus .d-square{width:52px;height:52px;background:#0047ab;right:14px;top:14px}
  .s-bauhaus .d-tri{width:0;height:0;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:58px solid #ffd400;right:-6px;bottom:-10px}

  /* 03 装饰艺术 */
  .s-deco{background:radial-gradient(120% 120% at 50% 0%,#16213e 0%,#0b1024 70%);color:#d8b45a;font-family:Georgia,'Times New Roman',serif}
  .s-deco .p-frame{border:6px double #d8b45a;margin:12px;padding:16px;text-align:center;justify-content:center}
  .s-deco .p-eyebrow{letter-spacing:5px;color:#b8924a;font-size:9px}
  .s-deco .p-name{font-size:clamp(20px,2.6vw,26px);letter-spacing:3px;font-weight:700;margin-top:10px}
  .s-deco .p-role{letter-spacing:4px;font-size:10px;text-transform:uppercase;color:#c9a55c}
  .s-deco .p-intro{font-size:11.5px;color:#cdb577;font-style:italic}
  .s-deco .p-tags{justify-content:center}
  .s-deco .p-tags span{border:1px solid #d8b45a;background:transparent;border-radius:0;letter-spacing:1px}
  .s-deco .d-arch{left:50%;top:10px;transform:translateX(-50%);width:120px;height:60px;border:2px solid #d8b45a;border-bottom:none;border-radius:120px 120px 0 0}
  .s-deco .d-frame{inset:0;border:2px solid rgba(216,180,90,.35);margin:6px}

  /* 04 赛博朋克 */
  .s-cyber{background:#0a0118;color:#eaffff;font-family:'Segoe UI',sans-serif}
  .s-cyber::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px);pointer-events:none;z-index:3}
  .s-cyber .p-frame{padding:20px;justify-content:flex-end;background:linear-gradient(180deg,transparent 55%,rgba(255,0,200,.14))}
  .s-cyber .p-eyebrow{color:#ff2bd6;letter-spacing:3px;font-weight:700}
  .s-cyber .p-name{font-size:clamp(22px,2.8vw,30px);color:#fff;text-shadow:0 0 12px #0ff,0 0 26px #f0f;animation:glitchTxt 2.4s infinite}
  .s-cyber .p-role{color:#0ff}
  .s-cyber .p-intro{color:#b8e6ff}
  .s-cyber .p-tags span{background:rgba(0,255,255,.14);color:#0ff;border:1px solid #0ff}
  .s-cyber .p-mail{color:#7ee8ff}
  .s-cyber .d-grid{inset:-40% 0 0 0;background:repeating-linear-gradient(0deg,#0ff 0 1px,transparent 1px 34px),repeating-linear-gradient(90deg,#0ff 0 1px,transparent 1px 34px);opacity:.22;transform:perspective(400px) rotateX(62deg);transform-origin:top}

  /* 05 极简主义 */
  .s-minimal{background:#fff;color:#1a1a1a;font-family:'Segoe UI',sans-serif}
  .s-minimal .p-frame{justify-content:space-between;padding:22px}
  .s-minimal .p-eyebrow{color:#aaa;font-size:9px;letter-spacing:3px}
  .s-minimal .p-name{font-weight:300;font-size:clamp(22px,3vw,30px)}
  .s-minimal .p-role{color:#777;font-size:11px}
  .s-minimal .p-intro{color:#999;font-size:11px;max-width:240px}
  .s-minimal .p-tags span{border:1px solid #ddd;color:#666;background:#fff}
  .s-minimal .p-mail{color:#bbb}
  .s-minimal .d-line{left:22px;right:22px;top:58px;height:1px;background:#e8e8e8}
  .s-minimal .d-dot{right:30px;bottom:30px;width:8px;height:8px;border-radius:50%;background:#e30613}

  /* 06 日式和风 */
  .s-wa{background:#f3ece1;color:#2e2a24;font-family:'KaiTi','STKaiti','Microsoft YaHei',serif}
  .s-wa .p-frame{padding:24px}
  .s-wa .p-eyebrow{color:#8a7355;letter-spacing:4px}
  .s-wa .p-name{font-size:clamp(22px,3vw,30px);letter-spacing:6px}
  .s-wa .p-role{color:#6d5a41}
  .s-wa .p-intro{color:#57493a;line-height:2}
  .s-wa .p-tags span{background:#2e2a24;color:#f3ece1;border-radius:0}
  .s-wa .d-en{left:50%;top:50%;width:180px;height:180px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(60,50,40,.05) 0 55%,rgba(60,50,40,.35) 62%,transparent 66%)}
  .s-wa .d-seal{right:16px;bottom:16px;width:34px;height:34px;background:#c0272d;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;transform:rotate(-8deg)}
  .s-wa .d-vtext{right:14px;top:64px;writing-mode:vertical-rl;font-size:11px;letter-spacing:6px;color:#8a7355}

  /* 07 孟菲斯 */
  .s-memphis{background:#ffe27a;color:#1b1b1b;font-family:'Trebuchet MS','Segoe UI',sans-serif}
  .s-memphis .p-frame{padding:20px}
  .s-memphis .p-name{font-size:clamp(21px,2.8vw,28px);font-weight:900}
  .s-memphis .p-role{font-weight:700}
  .s-memphis .p-intro{font-size:12px}
  .s-memphis .p-tags span{background:#fff;border:2px solid #1b1b1b;border-radius:0;font-weight:700}
  .s-memphis .d-zig{left:0;right:0;top:0;height:14px;background:repeating-linear-gradient(135deg,#1b1b1b 0 8px,transparent 8px 16px)}
  .s-memphis .d-dots{right:14px;top:24px;width:46px;height:46px;background-image:radial-gradient(#ff3e6b 3.5px,transparent 4px);background-size:12px 12px}
  .s-memphis .d-blob{left:-24px;bottom:-30px;width:120px;height:120px;border-radius:46% 54% 62% 38%/48% 40% 60% 52%;background:#7ed7ff;border:3px solid #1b1b1b;animation:floaty 5s ease-in-out infinite}

  /* 08 酸性设计 */
  .s-acid{background:#d6ff00;color:#000;font-family:'Segoe UI',sans-serif}
  .s-acid .p-frame{padding:20px}
  .s-acid .p-name{font-size:clamp(24px,3.2vw,34px);font-weight:900;font-style:italic;background:linear-gradient(180deg,#9a9a9a 0%,#fff 35%,#c9c9c9 60%,#5f5f5f 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .s-acid .p-intro{font-size:12px;font-weight:600}
  .s-acid .p-tags span{background:#000;color:#d6ff00;border-radius:0;font-weight:800}
  .s-acid .d-drip1{right:8px;top:0;width:44px;height:96px;background:#000;border-radius:0 0 46% 54%/0 0 86% 92%;animation:drip 4s ease-in-out infinite}
  .s-acid .d-drip2{left:22px;bottom:0;width:30px;height:70px;background:#000;border-radius:54% 46% 0 0/92% 86% 0 0}
  /* 09 哥特 */
  .s-gothic{background:#0d0d10;color:#d9d2c0;font-family:Georgia,'Times New Roman',serif}
  .s-gothic::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 0%,rgba(255,180,60,.10),transparent 60%);pointer-events:none}
  .s-gothic .p-frame{text-align:center;justify-content:center;align-items:center;padding:24px;border:1px solid #5a4a2f;margin:14px;background:linear-gradient(180deg,rgba(90,74,47,.14),transparent)}
  .s-gothic .p-eyebrow{letter-spacing:5px;color:#8a7a52;font-size:9px}
  .s-gothic .p-name{font-size:clamp(22px,3vw,28px);letter-spacing:2px;margin-top:8px}
  .s-gothic .p-role{color:#b8a97f;font-style:italic}
  .s-gothic .p-intro{color:#a89f8a;font-size:11.5px}
  .s-gothic .p-tags{justify-content:center}
  .s-gothic .p-tags span{border:1px solid #8a7a52;background:transparent;border-radius:0;color:#c8b98e}
  .s-gothic .d-arch2{left:50%;top:0;transform:translateX(-50%);width:110px;height:76px;border:2px solid #8a7a52;border-bottom:none;border-radius:110px 110px 0 0;opacity:.8}

  /* 10 Y2K */
  .s-y2k{background:linear-gradient(135deg,#ff7ad9,#ffd86b,#7df9ff);background-size:300% 300%;animation:huebg 6s ease infinite;color:#fff;font-family:'Segoe UI',sans-serif}
  .s-y2k .p-frame{padding:20px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
  .s-y2k .p-name{font-size:clamp(24px,3.2vw,32px);font-weight:900;background:linear-gradient(180deg,#fff 0%,#d9f2ff 45%,#ffe2f4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .s-y2k .p-tags span{background:rgba(255,255,255,.28);color:#fff;border:1.5px solid #fff}
  .s-y2k .d-star1{right:18px;top:16px;font-size:30px;animation:twinkle 1.6s ease-in-out infinite}
  .s-y2k .d-star2{left:16px;top:40px;font-size:18px;animation:twinkle 1.6s ease-in-out .6s infinite}

  /* 11 蒸汽波 */
  .s-vapor{background:linear-gradient(180deg,#7b2ff7 0%,#b06ef9 45%,#ff9ecb 100%);color:#fff;font-family:'Segoe UI',sans-serif}
  .s-vapor::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 2px,transparent 2px 5px);pointer-events:none}
  .s-vapor .p-frame{justify-content:flex-end;padding:20px}
  .s-vapor .p-name{font-size:clamp(24px,3.2vw,32px);font-weight:800;letter-spacing:1px}
  .s-vapor .p-role{color:#ffe6f2}
  .s-vapor .p-tags span{background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.6)}
  .s-vapor .d-sun{left:50%;top:26%;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:linear-gradient(180deg,#ffe27a,#ff6ec7);opacity:.9}
  .s-vapor .d-persp{left:0;right:0;bottom:0;height:44%;background:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 30px),repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 46px);opacity:.35;transform:perspective(300px) rotateX(58deg);transform-origin:bottom}

  /* 12 粗野主义 */
  .s-brutal{background:#f4f145;color:#0a0a0a;font-family:'Arial Black','Segoe UI',sans-serif}
  .s-brutal .p-frame{padding:16px;margin:10px;border:4px solid #0a0a0a;background:#f4f145;box-shadow:8px 8px 0 #0a0a0a}
  .s-brutal .p-name{font-size:clamp(24px,3.2vw,32px);text-transform:uppercase}
  .s-brutal .p-role{font-weight:700;font-size:13px;background:#0a0a0a;color:#f4f145;display:inline-block;padding:2px 10px;transform:rotate(-1.5deg)}
  .s-brutal .p-intro{font-family:'Segoe UI',sans-serif;font-weight:600;font-size:12px}
  .s-brutal .p-tags span{background:#fff;border:3px solid #0a0a0a;border-radius:0;font-weight:800;box-shadow:3px 3px 0 #0a0a0a}
  .s-brutal .d-badge{right:12px;top:12px;background:#ff4d6d;color:#fff;border:3px solid #0a0a0a;padding:4px 8px;font-size:11px;transform:rotate(8deg);font-weight:900;box-shadow:3px 3px 0 #0a0a0a}

  /* 13 新艺术 */
  .s-nouveau{background:#efe6d5;color:#3c4a33;font-family:Georgia,'Times New Roman',serif}
  .s-nouveau .p-frame{padding:22px;text-align:center}
  .s-nouveau .p-eyebrow{letter-spacing:4px;color:#8a9a6a;font-size:9px;text-transform:uppercase}
  .s-nouveau .p-name{font-style:italic;font-size:clamp(22px,3vw,28px);color:#2f3b28}
  .s-nouveau .p-role{color:#6d7a52;font-style:italic}
  .s-nouveau .p-intro{font-style:italic;color:#5c6848}
  .s-nouveau .p-tags{justify-content:center}
  .s-nouveau .p-tags span{border:1px solid #8a9a6a;background:transparent;color:#5c6848;border-radius:99px}
  .s-nouveau .d-vine{left:0;right:0;bottom:0;height:64px;background:radial-gradient(circle at 20% 100%,transparent 24px,#9bb06f 25px 26px,transparent 27px) repeat-x;background-size:60px 64px;opacity:.7}

  /* 14 未来主义 */
  .s-futur{background:#101418;color:#fff;font-family:'Segoe UI',sans-serif}
  .s-futur::after{content:"";position:absolute;left:-20%;bottom:-30%;width:80%;height:70%;background:#ff5e00;transform:rotate(-12deg);z-index:1;opacity:.92}
  .s-futur .p-frame{padding:20px}
  .s-futur .p-name{font-style:italic;font-weight:900;text-transform:uppercase;font-size:clamp(22px,3vw,30px);letter-spacing:1px}
  .s-futur .p-role{color:#ff8a3c;font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:11px}
  .s-futur .p-intro{color:#cfd8e0;font-size:12px}
  .s-futur .p-tags span{background:#ff5e00;color:#fff;font-weight:700;border-radius:0}
  .s-futur .d-speed{inset:0;background:repeating-linear-gradient(-45deg,transparent 0 26px,rgba(255,94,0,.16) 26px 27px,rgba(255,94,0,.34) 27px 30px)}

  /* 15 波普艺术 */
  .s-pop{background:#ffd400;color:#111;font-family:'Arial Black',sans-serif}
  .s-pop .p-frame{padding:20px}
  .s-pop .p-name{color:#fff;text-shadow:3px 3px 0 #e30613,-3px 3px 0 #0047ab;font-size:clamp(24px,3.2vw,32px);text-transform:uppercase}
  .s-pop .p-role{font-weight:900;color:#e30613}
  .s-pop .p-intro{font-family:'Segoe UI',sans-serif;font-weight:600}
  .s-pop .p-tags span{background:#fff;border:3px solid #111;border-radius:0;font-weight:800}
  .s-pop .d-burst{left:50%;top:-6px;transform:translateX(-50%) rotate(-6deg);width:86px;height:86px;background:#e30613;color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;clip-path:polygon(50% 0%,61% 14%,78% 5%,81% 22%,98% 26%,88% 40%,100% 52%,86% 60%,94% 76%,76% 74%,70% 90%,52% 78%,34% 90%,28% 72%,10% 74%,18% 58%,4% 50%,16% 38%,8% 22%,26% 22%,30% 6%,44% 14%)}
  .s-pop .d-dots2{inset:0;background-image:radial-gradient(rgba(17,17,17,.14) 2px,transparent 2.5px);background-size:10px 10px;opacity:.5}

    { cls: 's-glacier',  num: '50', label: '冰川极地',   deco: '<i class="d-crystal"></i><i class="d-snow"></i>' },
    { cls: 's-sunrise',  num: '51', label: '日出光晕',   deco: '<i class="d-sun2"></i><i class="d-wave"></i>' },
    { cls: 's-matrix',   num: '52', label: '代码矩阵',   deco: '<i class="d-rain"></i><i class="d-codeline">const AI = DeepSeek</i><i class="d-codeline2">01101010</i>' }
  ];

  function posterHTML(p, idx) {
    const tags = PROFILE.tags.map(function (t) { return '<span>' + t + '</span>'; }).join('');
    return '<article class="poster ' + p.cls + '" data-i="' + idx + '" title="' + p.label + '">' +
      '<div class="p-frame">' +
        '<div class="p-eyebrow">' + p.num + ' · ' + p.label + '</div>' +
        '<h3 class="p-name" data-t="' + PROFILE.name + '">' + PROFILE.name + '</h3>' +
        '<p class="p-role">' + PROFILE.role + '</p>' +
        '<p class="p-intro">' + PROFILE.intro + '</p>' +
        '<div class="p-tags">' + tags + '</div>' +
        '<div class="p-mail">' + PROFILE.mail + '</div>' +
      '</div>' +
      '<div class="p-deco">' + p.deco + '</div>' +
    '</article>';
  }

  let cur = 0;
  const wall = document.getElementById('wall');
  const lb = document.getElementById('lightbox');
  const lbStage = document.getElementById('lbStage');
  const lbCap = document.getElementById('lbCap');

  wall.innerHTML = POSTERS.map(posterHTML).join('');

  wall.addEventListener('click', function (e) {
    const art = e.target.closest ? e.target.closest('.poster') : null;
    if (!art) return;
    openPoster(parseInt(art.getAttribute('data-i'), 10));
  });

  function openPoster(i) {
    cur = (i + POSTERS.length) % POSTERS.length;
    lbStage.innerHTML = posterHTML(POSTERS[cur], cur);
    lbCap.textContent = POSTERS[cur].num + ' / ' + POSTERS.length + '  ·  ' + POSTERS[cur].label;
    lb.classList.add('on');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closePoster() {
    lb.classList.remove('on');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function stepPoster(d) { openPoster(cur + d); }

  document.getElementById('lbClose').addEventListener('click', closePoster);
  document.getElementById('lbPrev').addEventListener('click', function () { stepPoster(-1); });
  document.getElementById('lbNext').addEventListener('click', function () { stepPoster(1); });

  lb.addEventListener('click', function (e) { if (e.target === lb) closePoster(); });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') closePoster();
    if (e.key === 'ArrowRight') stepPoster(1);
    if (e.key === 'ArrowLeft') stepPoster(-1);
  });
</script>
