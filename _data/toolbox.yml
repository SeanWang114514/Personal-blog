# ============================================================================
#  工具箱 —— 驱动 /toolbox/ 页面
#  纯外链导航，本地不引入任何脚本，打开即跳转。
#
#  字段说明：
#    key / title / icon / desc   分组（icon 取 _includes/icons.html 里的图标 id，去掉 i- 前缀）
#    items[].name / url / desc   条目
#    items[].oss                 可选，true 会在条目前挂一个「开源」小标
#    items[].cn                  可选，true 会在条目前挂一个「国内」小标
#
#  收录原则：优先开源 / 免登录 / 浏览器内本地跑（数据不外传）的站点。
# ============================================================================

