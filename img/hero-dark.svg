<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620"
  preserveAspectRatio="xMidYMid slice" role="img" aria-label="抽象渐变背景">
  <defs>
    <linearGradient id="hbd-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>
    <radialGradient id="hbd-g0" cx="220" cy="120" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#1d4ed8" stop-opacity="0.176"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hbd-g1" cx="1320" cy="90" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#0e7490" stop-opacity="0.143"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hbd-g2" cx="900" cy="620" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c1d95" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#4c1d95" stop-opacity="0.160"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hbd-g3" cx="1500" cy="560" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#0f766e" stop-opacity="0.101"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hbd-g4" cx="60" cy="600" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#1e3a8a" stop-opacity="0.126"/>
      <stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="hbd-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="620" fill="url(#hbd-base)"/>
  <rect width="1600" height="620" fill="url(#hbd-g0)"/>
  <rect width="1600" height="620" fill="url(#hbd-g1)"/>
  <rect width="1600" height="620" fill="url(#hbd-g2)"/>
  <rect width="1600" height="620" fill="url(#hbd-g3)"/>
  <rect width="1600" height="620" fill="url(#hbd-g4)"/>
  <rect width="1600" height="620" filter="url(#hbd-grain)" opacity="0.5"/>
</svg>
