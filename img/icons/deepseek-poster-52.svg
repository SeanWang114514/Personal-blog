<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
  role="img" aria-label="DeepSeek 海报展">
  <title>DeepSeek 海报展</title>
  <defs>
    <linearGradient id="ps" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cb7df5"/><stop offset="1" stop-color="#0a6ad8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#ps)"/>
  <!-- 三张叠放的海报，呼应「52 种风格」 -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round">
    <rect x="26" y="34" width="46" height="62" rx="5" opacity=".55"/>
    <rect x="42" y="26" width="46" height="62" rx="5" opacity=".8"/>
    <rect x="58" y="34" width="44" height="62" rx="5"/>
  </g>
  <rect x="68" y="46" width="24" height="6" rx="3" fill="#fff"/>
  <rect x="68" y="60" width="16" height="6" rx="3" fill="#fff" opacity=".7"/>
</svg>
