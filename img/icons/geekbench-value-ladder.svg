  <title>Geekbench 性价比天梯图</title>
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40c8e0"/><stop offset="1" stop-color="#0a6ad8"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#gb)"/>
