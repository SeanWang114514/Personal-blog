    <rect x="46" y="62" width="14" height="40" rx="4" opacity=".75"/>
    <rect x="66" y="48" width="14" height="54" rx="4" opacity=".9"/>
    <rect x="86" y="34" width="14" height="68" rx="4"/>
  </g>
  <line x1="22" y1="104" x2="106" y2="104" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
</svg>
