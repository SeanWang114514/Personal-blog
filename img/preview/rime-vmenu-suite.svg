<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
  role="img" aria-label="一个 v 键的功能菜单示意图">
  <title>一个 v 键的功能菜单</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#cb7df5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#cb7df5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>

  
  <rect x="40" y="44" width="380" height="196" rx="16" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/>
  
  <rect x="62" y="72" width="336" height="42" rx="10"
    fill="rgba(90,169,255,0.16)"
    stroke="#5aa9ff" stroke-width="2"/>
  <circle cx="90" cy="93" r="11" fill="#5aa9ff"/>
  <text x="116" y="101" fill="#f2f2f7" font-size="24"
    font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">词库管理</text>
  <rect x="62" y="126" width="336" height="42" rx="10"
    fill="rgba(255,255,255,0.05)"
    stroke="none" stroke-width="0"/>
  <circle cx="90" cy="147" r="11" fill="#30d158"/>
  <text x="116" y="155" fill="#a8a8ad" font-size="24"
    font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">剪贴板历史</text>
  <rect x="62" y="180" width="336" height="42" rx="10"
    fill="rgba(255,255,255,0.05)"
    stroke="none" stroke-width="0"/>
  <circle cx="90" cy="201" r="11" fill="#ff9f0a"/>
  <text x="116" y="209" fill="#a8a8ad" font-size="24"
