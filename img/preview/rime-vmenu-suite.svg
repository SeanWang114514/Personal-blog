  <rect x="452" y="88" width="148" height="108" rx="16" fill="#2c2c2e" stroke="#3a3a3c" stroke-width="1.5"/>
  <text x="526" y="150" fill="#5aa9ff" font-size="52" font-weight="700" text-anchor="middle"
    font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">v</text>
  <text x="526" y="176" fill="#a8a8ad" font-size="18" text-anchor="middle"
