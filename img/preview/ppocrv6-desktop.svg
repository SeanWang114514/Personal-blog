  <line x1="424" y1="190" x2="600" y2="190" stroke="rgba(255,255,255,0.10)"/>
  
  <rect x="424" y="224" width="80" height="18" rx="4" fill="rgba(255,255,255,0.06)"/>
  <text x="464" y="236.5" fill="#40c8e0" font-size="10"
