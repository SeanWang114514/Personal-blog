  <rect x="64" y="96" width="120" height="7" rx="3.5" fill="rgba(255,255,255,0.14)"/><rect x="64" y="112" width="220" height="7" rx="3.5" fill="rgba(255,255,255,0.14)"/><rect x="64" y="128" width="180" height="7" rx="3.5" fill="rgba(255,255,255,0.14)"/><rect x="64" y="144" width="240" height="7" rx="3.5" fill="rgba(255,255,255,0.14)"/><rect x="64" y="160" width="140" height="7" rx="3.5" fill="rgba(255,255,255,0.14)"/>
