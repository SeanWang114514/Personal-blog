  <line x1="0" y1="30" x2="640" y2="30" stroke="rgba(255,255,255,0.10)"/>
  <rect x="24" y="46" width="368" height="240" rx="7" fill="#2c2c2e" stroke="rgba(255,255,255,0.10)"/>
  <rect x="40" y="62" width="336" height="150" rx="5" fill="rgba(255,255,255,0.035)"/>
  <rect x="52" y="76" width="310" height="96" rx="4" fill="none" stroke="#ff9f0a"
